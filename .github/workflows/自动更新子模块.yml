name: 自动更新子模块

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 0点 = 本地8点
    - cron: '0 8 * * *'   # UTC 8点 = 本地16点
    - cron: '0 16 * * *'  # UTC 16点 = 本地0点
  workflow_dispatch:      # 允许手动点击运行

permissions:
  contents: write          # 允许自动提交并推送

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: 将子模块更新到上游最新版本
        run: |
          # 遍历所有子模块，拉取上游主分支最新代码
          git submodule update --remote --recursive

      - name: 如有变更则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "自动将子模块同步到最新的上游版本"
          git push
